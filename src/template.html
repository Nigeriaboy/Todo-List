    <meta charset="UTF-8">

    <title>Document</title>

<body>

    <header>
        <div id="logo">TO-DO</div>
    </header>
    
    <main>
        <div id="left-side-bar">
            <p>PROJECTS :</p>
            <div id="projects">

            </div>
        </div> 
        <div id="right-side-bar">
            <div id="addprojectbtn" class="btn" ><p>+ Add Project</p></div>
            <div id="project-display">
                <div id="project-name">Project NAME</div>
                <div id="project-description">PROJECT DESCRIPTION</div>
            </div>
            <div id="task-display">
                <div style="border-left: solid var(--high-priority);">
                    <p class="task-name">Task Name</p>
                    <p class="description">Description</p>
                    <p class="due-date">due-date</p>
                    <p class="open">></p>
                    <p class="priority">priority</p>
                    <p class="done">done</p>
                </div>

                <div style="border-left: solid var(--low-priority);">
                    <p class="task-name">Task Name</p>
                    <p class="description">Description</p>
                    <p class="due-date">due-date</p>
                    <p class="open">^</p>
                    <p class="priority">priority</p>
                    <p class="done">Done</p>
                </div>

            </div>

            <div id="addtaskbtn" class="btn" ><p>+ Add Task</p></div>
        </div>
    </main>
